name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pinned, with the checksum published on the release. `just` has no vendor
  # action, and a five-line verified download beats trusting a third-party one.
  JUST_VERSION: 1.57.0
  JUST_SHA256: 45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155

jobs:
  # The inner loop. Hermetic, parallel, offline, budgeted at 60 s wall-clock by
  # EVALUATION.md. No Docker, no pinned rustc, no Miri.
  test:
    name: just test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install just
        run: |
          set -euo pipefail
          url="https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf -o just.tar.gz "$url"
          echo "${JUST_SHA256}  just.tar.gz" | sha256sum --check --strict
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just
          just --version

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Cache cargo registry and target
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            room/target
          key: cargo-${{ runner.os }}-${{ hashFiles('room/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The one step allowed to use the network. Everything `just test` needs is
      # on disk after this, which is what lets the next step run --offline.
      - run: just setup

      - run: just test

      # T-09, T-21. The two harness clients, which `just test` does not compile
      # (they are feature-gated to hold its 60 s budget), and their own unit
      # tests; kept on this fast job so a broken client fails early. The
      # in-process runs against a live room are `test-full`'s (harness-full).
      - name: The smoke and burst clients
        run: cd room && cargo test --offline --locked --features burst --test smoke_config --bin smoke --bin burst

  # Everything that exists, plus a named list of what does not. Docker is used by
  # this hook only: it builds T-15a's sandbox image and runs the AC-12 containment
  # suite on it. T-21's burst and smoke run inside it against a room the job
  # starts in-process on loopback; the deployed runs are deployed-burst.yml,
  # which the client triggers (nothing unattended can create a deployed room).
  test-full:
    name: just test-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install just
        run: |
          set -euo pipefail
          url="https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf -o just.tar.gz "$url"
          echo "${JUST_SHA256}  just.tar.gz" | sha256sum --check --strict
          tar -xzf just.tar.gz just
          sudo install -m 0755 just /usr/local/bin/just
          just --version

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Cache cargo registry and target
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            room/target
          key: cargo-full-${{ runner.os }}-${{ hashFiles('room/Cargo.lock') }}
          restore-keys: cargo-full-${{ runner.os }}-

      # Asserted rather than assumed: the ubuntu runner ships Docker, and this
      # hook's whole reason for being separate is that it is allowed to use it.
      # If a future runner image drops it, that should fail here and loudly.
      - name: Docker is available to this job
        run: docker --version

      # Keyed on exactly the two files that decide what is inside the image. A
      # change to either is a different image and must rebuild; anything else
      # reuses this one, which matters because the expensive layer is
      # `cargo miri setup` building the standard library for Miri.
      #
      # The image is cached rather than the build layers because its tag carries
      # the same two inputs as this key (the pin and a digest of the Dockerfile):
      # `just sandbox-build` finds the restored image under the tag it expects and
      # skips the build entirely. One mechanism, not two.
      - name: Cache the sandbox image
        id: sandbox-image
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/popquiz-sandbox.tar
          key: sandbox-${{ runner.os }}-${{ hashFiles('pipeline/sandbox/Dockerfile', 'pipeline/sandbox/pin.toml') }}

      - name: Restore the sandbox image
        if: steps.sandbox-image.outputs.cache-hit == 'true'
        run: docker load --input /tmp/popquiz-sandbox.tar

      - run: just setup

      - run: just test-full

      # Only on a miss: on a hit the tarball is already what the cache holds.
      - name: Save the sandbox image for the next run
        if: steps.sandbox-image.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd pipeline
          image=$(uv run --no-sync python -c 'from popquiz.sandbox import read_pin; print(read_pin(require_recorded=False).image)')
          docker save --output /tmp/popquiz-sandbox.tar "$image"
