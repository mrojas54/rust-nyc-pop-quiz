<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rust NYC Pop Quiz</title>
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/components.css">
<link rel="stylesheet" href="/landing/landing.css">
</head>
<body class="landing-page">
<!-- The front door (GET /). Everything on it is drawn by landing.js from
     web/shared/copy.js into #land-head, #land-copy and #land-foot; this page types no string of its own (SPEC §11).
     It carries no room state and makes no request of its own: the two ways
     out are plain links, /join for a room and /last for the last question. -->
<div class="landing">
  <header id="land-head" class="land-head"></header>
  <main class="land-main">
    <div id="land-copy" class="land-copy"></div>
    <!-- Ferris as the Lady in the harbour: decoration only, so no alt text. -->
    <div class="land-art"><img class="land-ferris" src="/landing/ferris.png" alt="" width="770" height="536"></div>
  </main>
  <footer id="land-foot" class="land-foot"></footer>
</div>
<script src="/shared/copy.js"></script>
<script src="/landing/landing.js"></script>
</body>
</html>
