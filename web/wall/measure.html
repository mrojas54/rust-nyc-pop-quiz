<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall · measured layout</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/components.css">
<link rel="stylesheet" href="wall.css">
</head>
<body class="wall-page">
<!-- The wall's measured-layout run (AC-100, AC-33) — a developer page, never
     served by the room. It is the real wall code (wall.js, typemodel.js) on
     the real q3 payloads (fixtures/q3-phases.json, generated by
     room/tests/wall_page.rs), with each bank question's SOURCE put in the well:
     the options, split and receipt stay q3's, because the type model only
     reads the source. Serve the repo root and open it in a browser:

       python3 -m http.server 8765 --bind 127.0.0.1
       open http://127.0.0.1:8765/web/wall/measure.html?run=1   (all questions)
       ...measure.html?q=q3&phase=reveal&i=0                    (one frame)

     ?run=1 writes a JSON report into #out: per question and phase, the
     derived and refitted font size, the refit passes, the measured overflow
     of the well and the page, and the verdict. Zero overflow wherever the
     verdict is `fits`, and the clipped edge wherever it is not, is AC-100's
     measured claim. There is no headless Chrome on the build machine or in CI,
     so this runs in the c11 browser (WKWebView); see room/README.md, Pages. -->
<div class="wall-stage"><div class="wall-wrap" id="measureWrap"></div></div>
<pre id="out" style="display:none"></pre>
<script src="../shared/dom.js"></script>
<script src="../shared/phase.js"></script>
<script src="../shared/check.js"></script>
<script src="../shared/well.js"></script>
<script src="../shared/trace.js"></script>
<script src="../shared/typemodel.js"></script>
<script src="../shared/copy.js"></script>
<script src="qr.js"></script>
<script src="wall.js"></script>
<script>
(async function () {
  "use strict";
  var PQ = window.PopQuiz;
  var params = new URLSearchParams(location.search);
  var fx = await (await fetch("fixtures/q3-phases.json")).json();
  var BANK = ["q3", "q4", "q7", "q8"];
  var bank = {};
  for (var i = 0; i < BANK.length; i++) {
    bank[BANK[i]] = await (await fetch("../../bank/questions/" + BANK[i] + ".json")).json();
  }

  function frameFor(q, phase, idx) {
    var base = fx.frames[phase];
    if (Array.isArray(base)) base = base[idx || 0];
    var f = JSON.parse(JSON.stringify(base));
    if (f.source !== undefined) f.source = bank[q].source;
    return f;
  }

  var wrap = document.getElementById("measureWrap");
  var fits = [];
  var wall = PQ.Wall.mount(wrap, { onFit: function (v) { fits.push(v); } });
  await document.fonts.ready;
  /* For driving one frame at a time from a browser console or automation. */
  window.showFrame = function (q, phase, idx) { wall.show(frameFor(q, phase, idx)); return wall.fitted(); };
  window.fixtures = fx;

  if (!params.get("run")) {
    wall.show(frameFor(params.get("q") || "q3", params.get("phase") || "live", Number(params.get("i") || 0)));
    return;
  }

  var report = { browser: navigator.userAgent, room: PQ.ROOM_DEFAULTS,
                 floorPx: Math.round(PQ.floorPx() * 100) / 100, rows: [] };
  var PHASES = ["live", "closed", "split", "work", "reveal"];
  BANK.forEach(function (q) {
    PHASES.forEach(function (phase) {
      /* Enter the phase from a title card so every row is a phase entry. */
      wall.show(fx.frames.idle);
      wall.show(frameFor(q, phase, 0));
      var f = wall.fitted();
      var sc = wrap.querySelector(".rn-src-scroll");
      var m = PQ.measureWell(sc);
      var well = wrap.querySelector(".rn-src");
      var d = PQ.derivedFontPx(bank[q].source, phase);
      report.rows.push({
        q: q, phase: phase,
        lines: PQ.sourceMetrics(bank[q].source).lines,
        widest: PQ.sourceMetrics(bank[q].source).widestChars,
        derivedPx: Math.round(d.fontPx * 10) / 10,
        fittedPx: Math.round(f.fontPx * 10) / 10,
        passes: f.passes,
        textBox: [sc.clientWidth, sc.clientHeight],
        overX: m.overX, overY: m.overY,
        verdict: f.verdict,
        edge: [well.classList.contains("clipped-x"), well.classList.contains("clipped-y")],
        pageOverX: document.documentElement.scrollWidth - document.documentElement.clientWidth,
        pageOverY: document.documentElement.scrollHeight - document.documentElement.clientHeight
      });
    });
  });
  var out = document.getElementById("out");
  out.textContent = JSON.stringify(report);
  out.setAttribute("data-done", "1");
})();
</script>
</body>
</html>
